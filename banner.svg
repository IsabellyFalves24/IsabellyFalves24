  <circle cx="420" cy="90" r="1" fill="#e0f2fe" opacity="0.4"/>
  <circle cx="700" cy="50" r="1.5" fill="#e0f2fe" opacity="0.6"/>
  <circle cx="980" cy="80" r="1" fill="#e0f2fe" opacity="0.4"/>

  <!-- Saturno -->
  <!-- Planeta -->
  <circle cx="980" cy="160" r="38" fill="#93c5fd"/>

  <!-- Anel -->
  <ellipse
    cx="980"
    cy="165"
    rx="65"
